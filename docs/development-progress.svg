<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" role="img" aria-labelledby="title description">
  <title id="title">Development journey: 60%</title>
  <desc id="description">A quiet five-stop development journey with Kaga at the sixty-percent milestone.</desc>

  <rect width="800" height="120" fill="#faf8ef"/>
  <text x="28" y="24" fill="#586d5b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2">DEVELOPMENT JOURNEY</text>

  <line x1="80" y1="84" x2="400" y2="84" stroke="#667c6c" stroke-width="2"/>
  <line x1="400" y1="84" x2="720" y2="84" stroke="#d8d0bf" stroke-width="2"/>
  <circle cx="80" cy="84" r="7" fill="#667c6c"/>
  <circle cx="240" cy="84" r="7" fill="#667c6c"/>
  <circle cx="400" cy="84" r="7" fill="#667c6c"/>
  <circle cx="560" cy="84" r="7" fill="#faf8ef" stroke="#b8af9d" stroke-width="2"/>
  <circle cx="720" cy="84" r="7" fill="#faf8ef" stroke="#b8af9d" stroke-width="2"/>

  <image href="kaga-progress-marker.png" x="376" y="30" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="400" y="111" fill="#887b67" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">60%</text>
</svg>
